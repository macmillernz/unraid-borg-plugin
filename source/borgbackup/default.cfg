# Borg Backup - shipped defaults.
# User settings are written to /boot/config/plugins/borgbackup/borgbackup.cfg
# and override anything here. Do not edit this file; it is replaced on update.

# --- repository -------------------------------------------------------------
REPO=""
REPO_TYPE="local"
SSH_KEY=""
PASSPHRASE_MODE="stored"
PASSPHRASE_FILE=""
ENCRYPTION="repokey-blake2"

# --- archives ---------------------------------------------------------------
ARCHIVE_FORMAT="{container}-{now:%Y-%m-%d_%H%M%S}"
ONE_ARCHIVE_PER_CONTAINER="yes"
COMPRESSION="zstd,3"
# Exclude patterns are NOT stored here - they are multi-line and contain shell
# metacharacters. See /boot/config/plugins/borgbackup/excludes.txt

# --- container selection ----------------------------------------------------
CONTAINER_MODE="all"
STOP_CONTAINERS="no"
STOP_TIMEOUT="60"

# --- retention --------------------------------------------------------------
PRUNE_ENABLED="yes"
KEEP_DAILY="7"
KEEP_WEEKLY="4"
KEEP_MONTHLY="6"
KEEP_YEARLY="0"
COMPACT="yes"

# --- schedule ---------------------------------------------------------------
SCHEDULE="daily"
MINUTE="0"
HOUR="3"
WEEKDAY="0"
MONTHDAY="1"
CRON=""

# --- notifications / logging ------------------------------------------------
NOTIFY="failure"
LOG_LEVEL="info"
